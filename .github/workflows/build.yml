name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          swift --version
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" = "27"

      - name: Validate repository structure
        run: ./Scripts/validate-project.sh

      - name: Inspect project and shared scheme
        run: xcodebuild -project Pomodoro.xcodeproj -scheme Pomodoro -list

      - name: Build app and Live Activity extension
        run: |
          set -o pipefail
          xcodebuild \
            -project Pomodoro.xcodeproj \
            -scheme Pomodoro \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Pomodoro.xcodeproj \
            -scheme Pomodoro \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned iPhone app
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          xcodebuild \
            -project Pomodoro.xcodeproj \
            -scheme Pomodoro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            clean build

      - name: Package unsigned IPA
        id: package
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          app="DeviceDerivedData/Build/Products/Release-iphoneos/Pomodoro.app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Built app version is not X.X.X: $version" >&2
            exit 1
          fi
          ./Scripts/package-unsigned-ipa.sh \
            "$app" \
            "Artifacts/Pomodoro-${version}.ipa"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned IPA
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Pomodoro-${{ steps.package.outputs.version }}
          path: Artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14
